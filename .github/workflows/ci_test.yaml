name: CI Test - Working Directory Values

on:
  push:
    branches: [ci_test]
  pull_request:
    branches: [ci_test]
  workflow_dispatch:

jobs:
  test-workdir:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display working directory values
        run: |
          echo "github.workspace: ${{ github.workspace }}"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        shell: bash
